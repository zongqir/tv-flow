type: graph
schedule: "0 4 * * *"
tags:
- tv
- iptv
- live
- auto-heal
steps:
- name: probe_and_generate
  description: "每日凌晨 04:00 自动抓取权威上游、高并发测活洗流，生成长辈定制版与全量高可用 M3U"
  run: |
    export HOME=/home/zongqir
    export PATH=/home/zongqir/.local/bin:$PATH
    export http_proxy=http://127.0.0.1:7890
    export https_proxy=http://127.0.0.1:7890
    export all_proxy=socks5://127.0.0.1:7891
    export no_proxy="localhost,127.0.0.1,::1"
    cd /home/zongqir/code/tool/tv-flow
    /home/zongqir/.local/bin/tv-flow run --concurrency 50
  retry_policy:
    limit: 2
    interval_sec: 120

- name: push_to_git_remotes
  description: "将最新自愈后的 M3U 播放列表原子提交并推送到 GitHub 与 Gitee"
  depends:
  - probe_and_generate
  run: |
    export HOME=/home/zongqir
    export PATH=/home/zongqir/.local/bin:$PATH
    cd /home/zongqir/code/tool/tv-flow
    git add output/
    if ! git diff --cached --quiet; then
        git commit -m "chore(live): auto-heal TV streams $(date +'%Y-%m-%d %H:%M')"
    fi
    if git remote | grep -q github; then
        git push github main || echo "[Warn] GitHub push failed"
    fi
    if git remote | grep -q gitee; then
        git push gitee main || echo "[Warn] Gitee push failed"
    fi
